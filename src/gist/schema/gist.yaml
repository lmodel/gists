id: https://w3id.org/lmodel/gist
name: gist
title: gist
description: |-
  gist (general, integrated, semantic taxonomy) is a minimalist upper ontology created by Semantic Arts for enterprise knowledge graph applications. This LinkML schema (version 14.1.0) aggregates the gist modules: Core (classes and properties), MediaTypes (IANA media type instances), and PrefixDeclarations (SHACL namespace bindings). Supplementary schemas gist_rdfs_annotations and gist_sub_class_assertions are available for annotation enrichment and OWL RL reasoner support.
license: CC-BY-4.0
see_also:
- https://lmodel.github.io/gist
- https://www.semanticarts.com/gist/
- https://w3id.org/semanticarts/ontology/gistCore
version: 14.1.0

prefixes:
  gist: https://w3id.org/lmodel/gist/
  linkml: https://w3id.org/linkml/

default_prefix: gist
default_range: string

imports:
- linkml:types
- ./gist_core
- ./gist_media_types
- ./gist_prefix_declarations
