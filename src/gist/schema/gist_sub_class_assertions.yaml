id: https://w3id.org/lmodel/gist/sub-class-assertions
name: gist_sub_class_assertions
title: gist Subclass Assertions
description: |-
  Explicit rdfs:subClassOf assertions for gist classes (14.1.0). Supplement for RL reasoners that do not infer subclass relationships from OWL equivalentClass axioms.
license: CC-BY-4.0
see_also:
- https://www.semanticarts.com/gist/
source: https://w3id.org/semanticarts/ontology/gistSubClassAssertions
version: 14.1.0

prefixes:
